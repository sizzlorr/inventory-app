version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: inventory-db
    environment:
      POSTGRES_USER: myuser
      POSTGRES_PASSWORD: mypassword
      POSTGRES_DB: inventory_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U myuser -d inventory_db" ]
      interval: 5s
      timeout: 5s
      retries: 5
  # Наш бекенд (.NET)
  api:
    build: .
    container_name: inventory-api
#    ports:
#      - "5000:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - JwtSettings__Key=SuperSecretKeyForGunplaShopApiWhichMustBeAtLeast32CharactersLong
      # Передаємо рядок підключення до Postgres через змінні середовища!
      - ConnectionStrings__DefaultConnection=Host=db;Database=inventory_db;Username=myuser;Password=mypassword
      - AdminSettings__Username=admin
      - AdminSettings__Password=SuperSecureAdminPassword2026!
    volumes:
      - uploads_volume:/app/wwwroot/images
    depends_on:
      db:
        condition: service_healthy

  # Наш фронтенд (Angular + Nginx)
  frontend:
    # Вкажи відносний шлях до папки з фронтендом!
    # (Якщо вони лежать поруч, це буде щось типу ../inventory-frontend)
    build: ../../appFE
    container_name: inventory-frontend
    ports:
      - "80:80"
    depends_on:
      - api # Запускати тільки після старту бекенду

volumes:
  uploads_volume:
  pgdata: # Новий том для Postgres замість db_volume