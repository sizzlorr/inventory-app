server {
    listen 80;

    location / {
        root /usr/share/nginx/html;
        index index.html;
        # Якщо сторінка не знайдена, віддаємо index.html (обов'язково для Angular Routing)
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        # 'api' - це назва сервісу з docker-compose
        # 8080 - це внутрішній порт .NET контейнера
        proxy_pass http://api:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /images/ {
        proxy_pass http://api:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /swagger/ {
        proxy_pass http://api:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
